<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stat Buddy</title><link rel="stylesheet" href="styles.css"></head><body>
<header><h1>📊 Stat Buddy</h1><nav id="nav" class="hidden"><button type="button" data-page="classes">Home</button><button type="button" data-page="manage">Manage</button><button type="button" id="portalBtn">Teacher Portal</button><button type="button" id="logoutBtn">Log out</button></nav></header><main><div id="appError" class="card error hidden"></div>
<section id="login" class="page card narrow"><h2>Teacher login</h2><p>Demo: <b>teacher</b> / <b>demo123</b></p><input id="username" placeholder="Username"><input id="password" type="password" placeholder="Password"><button type="button" id="loginBtn" class="primary">Log in</button><p id="loginError" class="error"></p></section>
<section id="classes" class="page hidden"><div class="card"><h2>Select class</h2><div id="classTiles" class="tiles"></div></div></section>
<section id="tools" class="page hidden"><div class="card"><button type="button" data-page="classes">← Back</button><h2 id="classTitle"></h2><div id="toolTiles" class="tiles"></div></div></section>
<section id="names" class="page hidden"><div class="card"><button type="button" data-page="tools">← Back</button><div class="spread"><h2 id="toolTitle"></h2><button type="button" id="resetBtn" class="danger">Reset today</button></div><div id="pupilTiles" class="tiles"></div></div></section>
<section id="manage" class="page hidden"><div class="card"><button type="button" data-page="classes">← Back</button><div class="spread"><h2>Manage</h2><button type="button" id="addClassBtn" class="primary">＋ Add class</button></div><label>Class<select id="manageClass"></select></label><label>Class name<input id="className"></label><label>Class list<textarea id="classList" rows="8"></textarea></label><div class="save-row"><button type="button" id="saveClassBtn" class="primary">Save class</button><span id="savedMessage" class="saved hidden">✓ Saved</span></div><div class="spread"><h3>Tools</h3><button type="button" id="createToolBtn" class="primary">＋ Create a tool</button></div><div id="manageTools" class="tiles"></div><div id="editor"></div></div></section>
<section id="portal" class="page hidden"><div class="card"><button type="button" data-page="tools">← Back</button><div class="spread"><h2>Teacher Portal</h2><button type="button" id="exportBtn">Export CSV</button></div><label>Class<select id="portalClass"></select></label><label>Day<select id="portalDay"></select></label><div id="portalTabs" class="tabs"></div><div id="summary" class="tiles"></div><div class="table"><table><thead><tr><th>Pupil</th><th>Tool</th><th>Details</th></tr></thead><tbody id="records"></tbody></table></div></div></section></main>
<div id="entryModal" class="modal hidden"><div class="card modal-card"><button type="button" class="close">← Back</button><h2 id="entryTitle"></h2><div id="entryBody"></div><button type="button" id="saveEntryBtn" class="primary">Save result</button></div></div>
<div id="templateModal" class="modal hidden"><div class="card modal-card"><button type="button" class="close">← Close</button><h2>Create a tool from a template</h2><div id="templateTiles" class="tiles"></div></div></div>
<div id="exportModal" class="modal hidden"><div class="card modal-card"><button type="button" class="close">← Close</button><h2>Export CSV</h2><label>Date range<select id="exportRange"><option value="day">Selected day</option><option value="week">Past week</option><option value="month">Past month</option><option value="three">Past 3 months</option><option value="year">Past year</option><option value="all">All data</option></select></label><h3>Widgets</h3><div id="exportWidgets"></div><button type="button" id="downloadBtn" class="primary">Download CSV</button></div></div>
<script src="app.js" defer></script></body></html>
