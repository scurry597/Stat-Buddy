<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stat Buddy</title><link rel="stylesheet" href="styles.css"></head><body><header><h1>📊 Stat Buddy</h1><nav id="nav" class="hidden"><button data-page="classes">Home</button><button data-page="manage">Manage</button><button id="portalNav">Teacher Portal</button><button id="logout">Log out</button></nav></header><main>
<section id="login" class="page card narrow"><h2>Teacher login</h2><p>Demo: <b>teacher</b> / <b>demo123</b></p><label>Username<input id="username"></label><label>Password<input id="password" type="password"></label><button id="loginBtn" class="primary">Log in</button><p id="loginError" class="error"></p></section>
<section id="classes" class="page hidden"><div class="card"><h2>Select class</h2><div id="classTiles" class="tiles"></div></div></section>
<section id="tools" class="page hidden"><div class="card"><button data-page="classes">← Back</button><h2 id="classTitle"></h2><div id="toolTiles" class="tiles"></div></div></section>
<section id="tracker" class="page hidden"><div class="card"><button data-page="tools">← Back</button><div class="spread"><h2 id="trackerTitle"></h2><button id="resetTool" class="danger">Reset today</button></div><div id="sessionSetup"></div><div id="pupilTiles" class="tiles"></div></div></section>
<section id="manage" class="page hidden"><div class="card"><button data-page="classes">← Back</button><h2>Manage</h2><label>Class<select id="manageClass"></select></label><label>Class name<input id="className"></label><label>Class list<textarea id="classList" rows="8"></textarea></label><button id="saveClass" class="primary">Save class</button><span id="saved" class="hidden"> ✓ Saved</span><div class="spread"><h3>Widgets</h3><button id="createTool" class="primary">＋ Create a tool</button></div><div id="manageTools" class="tiles"></div><div id="editor"></div></div></section>
<section id="portal" class="page hidden"><div class="card"><button data-page="tools">← Back</button><h2>Teacher Portal</h2><label>Class<select id="portalClass"></select></label><label>Day<select id="portalDay"></select></label><div id="portalTabs" class="tabs"></div><div id="summary" class="tiles"></div><div class="table-wrap"><table><thead><tr><th>Pupil</th><th>Widget</th><th>Details</th></tr></thead><tbody id="rows"></tbody></table></div></div></section></main>
<div id="entryModal" class="modal hidden"><div class="card modal-card wide"><button class="close">← Back</button><h2 id="entryTitle"></h2><div id="entryBody"></div><button id="saveEntry" class="primary">Save result</button></div></div>
<div id="templateModal" class="modal hidden"><div class="card modal-card"><button class="close">← Close</button><h2>Copy a built-in widget</h2><div id="templateTiles" class="tiles"></div></div></div><script src="app.js" defer></script></body></html>
