<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Stat Buddy</title>

    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="drag-drop.css">
</head>

<body>

<header>
    <h1>📊 Stat Buddy</h1>

    <nav id="nav" class="hidden">
        <button data-page="classes">Home</button>
        <button data-page="manage">Manage</button>
        <button id="portalNav">Teacher Portal</button>
        <button id="logout">Log out</button>
    </nav>
</header>

<main>

<section id="login" class="page card narrow">

    <h2>📊 Stat Buddy</h2>

    <p>Make a difference with pupil stats</p>

    <p>
        Access your classes and assessment tools securely using your Microsoft account.
    </p>

    <button
        class="primary"
        onclick="window.location.href='/.auth/login/aad'">
        Sign in with Microsoft
    </button>

</section>

<section id="classes" class="page hidden">

    <div class="card">

        <h2>Select Class</h2>

        <div id="classTiles" class="tiles"></div>

    </div>

</section>

<section id="tools" class="page hidden">

    <div class="card">

        <button data-page="classes">← Back</button>

        <h2 id="classTitle"></h2>

        <div id="toolTiles" class="tiles"></div>

    </div>

</section>

<section id="tracker" class="page hidden">

    <div class="card">

        <button data-page="tools">← Back</button>

        <div class="spread">
            <h2 id="trackerTitle"></h2>
            <button id="resetTool" class="danger">
                Reset today
            </button>
        </div>

        <div id="sessionSetup"></div>

        <div id="pupilTiles" class="tiles"></div>

    </div>

</section>

<section id="manage" class="page hidden">

    <div class="card">

        <button data-page="classes">← Back</button>

        <h2>Manage</h2>

        <label>
            Class
            <select id="manageClass"></select>
        </label>

        <label>
            Class name
            <input id="className">
        </label>

        <label>
            Class list
            <textarea id="classList" rows="8"></textarea>
        </label>

        <button id="saveClass" class="primary">
            Save class
        </button>

        <span id="saved" class="hidden">
            ✓ Saved
        </span>

        <div class="spread">
            <h3>Widgets</h3>
            <button id="createTool" class="primary">
                ＋ Create a tool
            </button>
        </div>
